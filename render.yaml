# Render Blueprint: dashboard -> New -> Blueprint -> pick this repo. Free plan, no card needed.
services:
  - type: web
    name: niche
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/usage
    envVars:
      - key: NICHE_ADMIN_TOKEN        # password for /curate writes; Render generates one
        generateValue: true
      - key: NICHE_LLM                # public site: no paid Claude calls, free local reading only
        value: "off"
