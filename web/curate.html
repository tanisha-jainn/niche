<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche · curate brands</title>
<style>
:root{--bg:#fbfaf8;--fg:#17150f;--muted:#76715f;--line:#e6e1d8;--card:#fff;--pill:#f1ede6;--accent:#17150f;--accent-fg:#fff;--ok:#2f7d4f;--warn:#a35f12;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--fg:#f0ede6;--muted:#9c978a;--line:#2a2824;--card:#1a1917;--pill:#242220;--accent:#f0ede6;--accent-fg:#121110;--ok:#7fd39a;--warn:#e0a35a;--bad:#f28b82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
header h1{font-size:17px;margin:0}
header .sum{color:var(--muted);font-size:13px}
header .sp{flex:1}
main{padding:14px 22px 80px;max-width:1500px;margin:0 auto}
.row{display:grid;grid-template-columns:270px 1fr 150px;gap:16px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row.dropped{opacity:.55}
.pv{display:flex;gap:4px;flex-wrap:wrap}
.pv img{width:62px;height:80px;object-fit:cover;border-radius:5px;background:var(--pill)}
.bn{font-weight:600;font-size:16px}
.bn a{text-decoration:none}
.bn a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:12.5px;margin:2px 0 6px}
.tier{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 7px;margin-right:6px}
.tier.A{background:#e3f3e8;color:#1f6b3f}.tier.B{background:#f3eee0;color:#7a5a12}.tier.C{background:#f9e3e1;color:#a52a22}.tier.x{background:var(--pill);color:var(--muted)}
@media (prefers-color-scheme:dark){.tier.A{background:#1f3a2a;color:#9ddbb0}.tier.B{background:#3a3120;color:#e7c777}.tier.C{background:#3f2220;color:#f2a39c}}
.reason{font-size:13.5px}
.ev{color:var(--muted);font-size:12.5px;margin-top:3px}
.tr{color:var(--muted);font-size:12.5px;margin-top:4px;font-style:italic}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.acts button.keep.on{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button.drop.on{background:var(--bad);border-color:var(--bad);color:#fff}
.acts .st{font-size:11.5px;color:var(--muted);text-align:center}
.empty{color:var(--muted);padding:30px 0;text-align:center}
@media (max-width:820px){.row{grid-template-columns:1fr}.acts{flex-direction:row}}
</style>
</head>
<body>
<header>
  <h1>Curate brands</h1>
  <span class="sum" id="sum"></span>
  <span class="sp"></span>
  <span class="sum">show:</span>
  <button data-f="C" class="on">C · remove?</button><button data-f="B">B · fine</button><button data-f="A">A · yes</button><button data-f="?">ungraded</button><button data-f="all">all</button>
  <input type="text" id="find" placeholder="find a brand" style="font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit">
  <button class="primary" id="apply">Apply to live index</button>
  <a href="/" style="font-size:13px">← back to Niche</a>
</header>
<main id="main"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = async (p, o = {}) => { const r = await fetch(p, o); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText); return r.json(); };
let rows = [], filter = 'C', find = '';
async function load() { const r = await api('/api/curate'); rows = r.brands; sum(r.summary, r.live_brands); render(); }
function sum(s, live) { $('#sum').textContent = `${s.brands} brands · graded A ${s.tiers.A || 0} / B ${s.tiers.B || 0} / C ${s.tiers.C || 0}${s.tiers['?'] ? ' / ungraded ' + s.tiers['?'] : ''} · you've decided ${s.decided} · would be live: ${s.live} (now ${live})`; }
function effective(b) { return b.decision || (b.tier === 'C' && b.verified ? 'drop' : 'keep'); }
function render() {
  const list = rows.filter(b => (filter === 'all' || (filter === '?' ? !b.tier : b.tier === filter)) && (!find || b.brand.toLowerCase().includes(find)));
  $('#main').innerHTML = list.length ? list.map(b => `<div class="row ${effective(b) === 'drop' ? 'dropped' : ''}" data-key="${esc(b.key)}">
    <div class="pv">${b.preview.slice(0, 6).map(u => `<img src="${esc(u)}" loading="lazy" alt="">`).join('')}</div>
    <div><div class="bn"><a href="https://${esc(b.domain)}" target="_blank" rel="noopener">${esc(b.brand)} ↗</a></div>
      <div class="meta">${esc(b.based_in || '')}${b.based_in ? ' · ' : ''}${b.items} pieces · median ${b.median_usd != null ? '$' + b.median_usd : '?'} · ${esc(b.currency)}${b.vendors > 2 ? ` · <b>${b.vendors} vendor names</b> (${esc(b.other_vendors.slice(0, 3).join(', '))}…)` : ''}</div>
      <div><span class="tier ${b.tier || 'x'}">${b.tier || '?'}${b.tier && !b.verified ? ' · unverified' : ''}</span><span class="reason">${esc(b.reason || 'not graded yet')}</span></div>
      ${b.evidence ? `<div class="ev">${esc(b.evidence)}</div>` : ''}
      ${b.traits.length ? `<div class="tr">${esc(b.traits.join(' · '))}</div>` : ''}
    </div>
    <div class="acts"><button class="keep ${b.decision === 'keep' ? 'on' : ''}" data-d="keep">keep</button><button class="drop ${b.decision === 'drop' ? 'on' : ''}" data-d="drop">drop</button>${b.decision ? '<button data-d="" style="font-size:12px">clear</button>' : ''}<span class="st">${b.decision ? 'your call' : (effective(b) === 'drop' ? 'auto-dropped' : 'auto-kept')}</span></div>
  </div>`).join('') : '<div class="empty">Nothing here.</div>';
}
document.querySelectorAll('header button[data-f]').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('header button[data-f]').forEach(x => x.classList.toggle('on', x === b)); filter = b.dataset.f; render(); }));
$('#find').addEventListener('input', e => { find = e.target.value.trim().toLowerCase(); render(); });
$('#main').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-d]'); if (!btn) return;
  const key = btn.closest('.row').dataset.key, b = rows.find(x => x.key === key);
  const r = await api('/api/curate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key, decision: btn.dataset.d || null }) });
  b.decision = btn.dataset.d || null; sum(r.summary, '…'); render();
});
$('#apply').addEventListener('click', async () => { $('#apply').textContent = 'Rebuilding…'; const r = await api('/api/curate/apply', { method: 'POST' }); $('#apply').textContent = 'Apply to live index'; alert(`Live index: ${r.live_brands} brands, ${r.items.toLocaleString()} pieces. Excluded: ${r.excluded.length}.`); load(); });
load();
</script>
</body>
</html>
